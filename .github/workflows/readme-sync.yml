name: README sync

on:
  schedule:
    - cron: "17 3 * * *"     # daily, after the snake refresh
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - scripts/update_readme.py
      - .github/workflows/readme-sync.yml

permissions:
  contents: write

concurrency:
  group: readme-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Refresh recently shipped repositories
        run: python3 scripts/update_readme.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md; then
            echo "README.md unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh recently shipped repositories"
          git push
